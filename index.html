<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lily's Essence - Responsive Catalog</title>
    <!-- Playfair Display and Inter Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Lily's Essence</h1>
        <p class="subtitle">10ml & 20ml Luxury Decants</p>
    </header>

    <div class="container">
        <!-- Product 1 -->
        <div class="content-box">
            <img src="images/viva-la-juicy.jpg" alt="Viva La Juicy">
            <div class="product-name">Viva La Juicy</div>
            <div class="product-notes">Wild berries, Mandarin, Honeysuckle, Caramel</div>
            <div class="product-price">₱450 - ₱800</div>
        </div>

        <!-- Product 2 -->
        <div class="content-box">
            <img src="images/prada-candy.jpg" alt="Prada Candy">
            <div class="product-name">Prada Candy</div>
            <div class="product-notes">Caramel, Powdery Notes, Musk, Benzoin</div>
            <div class="product-price">₱750 - ₱1500</div>
        </div>

        <!-- Product 3 -->
        <div class="content-box">
            <img src="images/vr-bonbon.jpg" alt="Viktor & Rolf Bonbon">
            <div class="product-name">Viktor & Rolf Bonbon</div>
            <div class="product-notes">Peach, Caramel, Orange Blossom, Amber</div>
            <div class="product-price">₱850 - ₱1700</div>
        </div>
    </div>

</body>
</html>
